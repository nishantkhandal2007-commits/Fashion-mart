<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KRONOS — Premium Fashion Marketplace</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://unpkg.com/lucide@latest"></script>

<style>
:root{
  --bg:#080a0f;
  --p:#10131b;
  --p2:#151925;
  --line:#ffffff17;
  --text:#f8fafc;
  --muted:#94a3b8;
  --a:#6366f1;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:'Plus Jakarta Sans',sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

body:before{
  content:"";
  position:fixed;
  inset:-30%;
  z-index:-1;
  background:
    radial-gradient(circle at 75% 10%,#6366f12e,transparent 28%),
    radial-gradient(circle at 10% 80%,#8b5cf61c,transparent 25%);
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:50;
  padding:15px 5%;
  display:flex;
  align-items:center;
  gap:22px;
  background:#080a0fd4;
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}

.brand{
  font-size:1.25rem;
  font-weight:800;
  letter-spacing:2px;
  white-space:nowrap;
}

.brand span{
  color:var(--a);
}

.search{
  position:relative;
  flex:1;
  max-width:520px;
  margin:auto;
}

.search i{
  position:absolute;
  left:15px;
  top:50%;
  transform:translateY(-50%);
  color:var(--muted);
  width:18px;
}

.search input{
  width:100%;
  background:#ffffff0d;
  border:1px solid var(--line);
  border-radius:999px;
  padding:11px 16px 11px 43px;
  color:#fff;
  outline:0;
}

.search input:focus{
  border-color:var(--a);
}

.actions{
  display:flex;
  gap:10px;
}

.ib{
  position:relative;
  background:none;
  border:0;
  color:#fff;
  padding:8px;
}

.badge{
  position:absolute;
  right:-2px;
  top:-2px;
  min-width:18px;
  height:18px;
  padding:0 5px;
  border-radius:20px;
  background:var(--a);
  font-size:10px;
  display:grid;
  place-items:center;
}

/* MAIN */

.wrap{
  max-width:1380px;
  margin:auto;
  padding:42px 22px 80px;
}

.hero{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:25px;
}

.hero h1{
  font-size:clamp(1.8rem,4vw,2.7rem);
  letter-spacing:-1px;
}

.hero p{
  color:var(--muted);
  margin-top:8px;
}

.counter{
  padding:9px 14px;
  border-radius:999px;
  background:#6366f11a;
  border:1px solid #6366f140;
  color:#a5b4fc;
  font-weight:700;
  font-size:.85rem;
}

/* CATEGORY BUTTONS */

.tabs{
  display:flex;
  gap:9px;
  overflow:auto;
  padding:4px 0 16px;
}

.tab{
  white-space:nowrap;
  padding:10px 17px;
  border:1px solid var(--line);
  border-radius:999px;
  background:#ffffff09;
  color:var(--muted);
  font-weight:700;
  font-size:.82rem;
}

.tab.active,
.tab:hover{
  background:var(--a);
  border-color:var(--a);
  color:#fff;
}

/* TOOLBAR */

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:7px 0 22px;
}

.result{
  color:var(--muted);
  font-size:.88rem;
}

.sort{
  background:var(--p);
  border:1px solid var(--line);
  color:#fff;
  border-radius:10px;
  padding:10px 13px;
  outline:0;
}

.sort option{
  background:#11131a;
}

/* PRODUCT GRID */

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(245px,1fr));
  gap:18px;
}

.card{
  position:relative;
  background:linear-gradient(
    145deg,
    #ffffff0e,
    #ffffff05
  );
  border:1px solid var(--line);
  border-radius:18px;
  padding:12px;
  transition:.25s;
  overflow:hidden;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#6366f16b;
  box-shadow:0 18px 50px #00000059;
}

.photo{
  height:220px;
  border-radius:13px;
  overflow:hidden;
  background:#161a24;
  position:relative;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.35s;
  cursor:pointer;
}

.card:hover .photo img{
  transform:scale(1.05);
}

.tag{
  position:absolute;
  top:12px;
  left:12px;
  z-index:2;
  background:#080a0fc7;
  border:1px solid #ffffff26;
  padding:5px 9px;
  border-radius:7px;
  font-size:.64rem;
  font-weight:800;
  text-transform:uppercase;
}

.heart{
  position:absolute;
  right:12px;
  top:12px;
  z-index:2;
  border:0;
  width:35px;
  height:35px;
  border-radius:50%;
  background:#080a0fc2;
  color:#fff;
  display:grid;
  place-items:center;
}

.heart.active{
  color:#fb7185;
}

.heart i{
  width:17px;
}

.info{
  padding:13px 3px 3px;
}

.name{
  font-size:1rem;
  font-weight:800;
}

.cat{
  color:var(--muted);
  font-size:.72rem;
  text-transform:uppercase;
  margin-top:5px;
}

.bottom{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin-top:14px;
}

.price{
  font-weight:800;
  font-size:1.1rem;
}

.old{
  display:block;
  color:var(--muted);
  font-size:.72rem;
  text-decoration:line-through;
  margin-top:2px;
}

.add{
  border:0;
  background:var(--a);
  color:#fff;
  border-radius:10px;
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
}

/* LOAD MORE */

.load{
  display:block;
  margin:35px auto 0;
  border:1px solid var(--line);
  background:var(--p);
  color:#fff;
  padding:12px 28px;
  border-radius:999px;
  font-weight:800;
}

.load:hover{
  background:var(--a);
}

/* DRAWERS */

.backdrop{
  position:fixed;
  inset:0;
  background:#000000ad;
  backdrop-filter:blur(4px);
  z-index:90;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.backdrop.open{
  opacity:1;
  pointer-events:auto;
}

.drawer{
  position:fixed;
  z-index:100;
  top:0;
  right:-430px;
  width:410px;
  max-width:100%;
  height:100vh;
  background:#0d1017;
  border-left:1px solid var(--line);
  padding:22px;
  transition:.3s;
  display:flex;
  flex-direction:column;
}

.drawer.open{
  right:0;
}

.dh,
.mh{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.close{
  background:none;
  border:0;
  color:#fff;
}

.list{
  flex:1;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.item{
  display:flex;
  gap:10px;
  align-items:center;
  padding:9px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#ffffff06;
}

.item img{
  width:58px;
  height:58px;
  object-fit:cover;
  border-radius:9px;
}

.iname{
  font-size:.82rem;
  font-weight:700;
  flex:1;
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:6px;
}

.qty button{
  width:24px;
  height:24px;
  border:1px solid var(--line);
  background:var(--p2);
  color:#fff;
  border-radius:6px;
}

.remove{
  background:none;
  border:0;
  color:#fb7185;
}

.total{
  border-top:1px solid var(--line);
  padding-top:15px;
  margin-top:12px;
}

.checkout{
  width:100%;
  border:0;
  background:var(--a);
  color:#fff;
  padding:13px;
  border-radius:11px;
  font-weight:800;
  margin-top:12px;
}

/* MODAL */

.modal{
  position:fixed;
  z-index:110;
  inset:50% auto auto 50%;
  transform:translate(-50%,-46%);
  width:min(850px,94vw);
  max-height:90vh;
  overflow:auto;
  background:#0d1017;
  border:1px solid var(--line);
  border-radius:20px;
  padding:20px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

.modal.open{
  opacity:1;
  pointer-events:auto;
  transform:translate(-50%,-50%);
}

.details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:24px;
}

.details img{
  width:100%;
  height:390px;
  object-fit:cover;
  border-radius:15px;
}

.details h2{
  font-size:1.7rem;
  margin:8px 0;
}

.details p{
  color:var(--muted);
  line-height:1.7;
  margin:14px 0;
}

.buy{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.buy button{
  flex:1;
  padding:13px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--p2);
  color:#fff;
  font-weight:800;
}

.buy .primary{
  background:var(--a);
  border-color:var(--a);
}

/* EMPTY */

.empty{
  text-align:center;
  color:var(--muted);
  padding:60px 10px;
}

/* TOAST */

.toast{
  position:fixed;
  z-index:200;
  left:50%;
  bottom:25px;
  transform:translate(-50%,100px);
  background:#fff;
  color:#080a0f;
  padding:11px 18px;
  border-radius:999px;
  font-weight:800;
  transition:.25s;
}

.toast.show{
  transform:translate(-50%,0);
}

/* MOBILE */

@media(max-width:700px){

  header{
    padding:13px 4%;
    flex-wrap:wrap;
  }

  .search{
    order:3;
    flex-basis:100%;
    max-width:none;
  }

  .hero{
    align-items:start;
    flex-direction:column;
  }

  .grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .photo{
    height:170px;
  }

  .card{
    padding:9px;
  }

  .details{
    grid-template-columns:1fr;
  }

  .details img{
    height:300px;
  }

  .drawer{
    width:100%;
  }
}

@media(max-width:420px){

  .photo{
    height:145px;
  }

  .name{
    font-size:.86rem;
  }
}
</style>
</head>

<body>

<header>

  <div class="brand">
    KRONOS<span>.</span>MEGASTORE
  </div>

  <div class="search">
    <i data-lucide="search"></i>
    <input
      id="search"
      placeholder="Search shoes, hoodies, jackets, accessories..."
    >
  </div>

  <div class="actions">

    <button class="ib" id="wishBtn">
      <i data-lucide="heart"></i>
      <span class="badge" id="wishCount">0</span>
    </button>

    <button class="ib" id="cartBtn">
      <i data-lucide="shopping-bag"></i>
      <span class="badge" id="cartCount">0</span>
    </button>

  </div>

</header>


<main class="wrap">

<section class="hero">

  <div>
    <h1>Premium Fashion Marketplace</h1>

    <p>
      Explore men's & women's fashion,
      footwear, sportswear and accessories.
    </p>
  </div>

  <div class="counter" id="counter">
    500 Products
  </div>

</section>


<div class="tabs" id="tabs">

  <button class="tab active" data-cat="all">
    All Products
  </button>

  <button class="tab" data-cat="men">
    Men
  </button>

  <button class="tab" data-cat="women">
    Women
  </button>

  <button class="tab" data-cat="men-shoes">
    Men's Shoes
  </button>

  <button class="tab" data-cat="women-shoes">
    Women's Shoes
  </button>

  <button class="tab" data-cat="slippers">
    Slippers
  </button>

  <button class="tab" data-cat="clothing">
    Clothing
  </button>

  <button class="tab" data-cat="sportswear">
    Sportswear
  </button>

  <button class="tab" data-cat="accessories">
    Accessories
  </button>

</div>


<div class="toolbar">

  <span class="result" id="result"></span>

  <select class="sort" id="sort">

    <option value="default">
      Sort: Featured
    </option>

    <option value="low">
      Price: Low to High
    </option>

    <option value="high">
      Price: High to Low
    </option>

    <option value="name">
      Name: A–Z
    </option>

  </select>

</div>


<section class="grid" id="grid"></section>


<button class="load" id="load">
  Load More Products (+24)
</button>

</main>


<!-- BACKDROP -->

<div class="backdrop" id="backdrop"></div>


<!-- CART -->

<aside class="drawer" id="cartDrawer">

  <div class="dh">

    <h2>
      Shopping Bag
    </h2>

    <button class="close" data-close>
      <i data-lucide="x"></i>
    </button>

  </div>

  <div class="list" id="cartList"></div>

  <div class="total" id="total"></div>

</aside>


<!-- WISHLIST -->

<aside class="drawer" id="wishDrawer">

  <div class="dh">

    <h2>
      Wishlist
    </h2>

    <button class="close" data-close>
      <i data-lucide="x"></i>
    </button>

  </div>

  <div class="list" id="wishList"></div>

</aside>


<!-- PRODUCT DETAILS -->

<div class="modal" id="productModal">

  <div class="mh">

    <h3>
      Product Details
    </h3>

    <button class="close" id="modalClose">
      <i data-lucide="x"></i>
    </button>

  </div>

  <div class="details" id="details"></div>

</div>


<!-- CHECKOUT -->

<div class="modal" id="checkoutModal">

  <div class="mh">

    <h3>
      Demo Checkout
    </h3>

    <button class="close" id="checkoutClose">
      <i data-lucide="x"></i>
    </button>

  </div>

  <p style="color:var(--muted);margin-bottom:18px">
    Frontend demo checkout for portfolio presentation.
  </p>

  <input
    class="sort"
    style="width:100%;margin-bottom:10px"
    placeholder="Full Name"
  >

  <input
    class="sort"
    style="width:100%;margin-bottom:10px"
    placeholder="Email Address"
  >

  <input
    class="sort"
    style="width:100%;margin-bottom:10px"
    placeholder="Delivery Address"
  >

  <button class="checkout" id="placeOrder">
    Place Demo Order
  </button>

</div>


<div class="toast" id="toast"></div>


<script>

const I = {

  men:[
    "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=85",

    "https://images.unsplash.com/photo-1608231387042-66d1773070a5?auto=format&fit=crop&w=800&q=85"
  ],

  women:[
    "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?auto=format&fit=crop&w=800&q=85",

    "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?auto=format&fit=crop&w=800&q=85"
  ],

  clothes:[
    "https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=800&q=85",

    "https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=800&q=85",

    "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=85"
  ],

  acc:[
    "https://images.unsplash.com/photo-1523170335258-f5ed11844a49?auto=format&fit=crop&w=800&q=85",

    "https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=800&q=85"
  ]

};


const T = [

  [
    'men-shoes',
    'Men',
    'Sneakers',
    [
      'Urban Runner',
      'Street High Top',
      'Phantom Velocity'
    ],
    I.men
  ],

  [
    'men-shoes',
    'Men',
    'Formal Shoes',
    [
      'Classic Derby',
      'Premium Loafers',
      'Oxford Classic'
    ],
    I.men
  ],

  [
    'women-shoes',
    'Women',
    "Women's Shoes",
    [
      'Cloud Walk',
      'Elegant Court',
      'Pastel Bloom'
    ],
    I.women
  ],

  [
    'slippers',
    'Men',
    'Slippers',
    [
      'Comfort Slides',
      'Cloud Slippers',
      'Everyday Slides'
    ],
    I.men
  ],

  [
    'slippers',
    'Women',
    'Slippers',
    [
      'Luna Slides',
      'Soft Femme',
      'Cozy Slippers'
    ],
    I.women
  ],

  [
    'clothing',
    'Men',
    'Clothing',
    [
      'Oversized Tee',
      'Essential Hoodie',
      'Urban Jacket'
    ],
    I.clothes
  ],

  [
    'clothing',
    'Women',
    'Clothing',
    [
      'Relaxed Tee',
      'Premium Hoodie',
      'Denim Jacket'
    ],
    I.clothes
  ],

  [
    'sportswear',
    'Men',
    'Sportswear',
    [
      'Performance Runner',
      'Training Set',
      'Sport Tee'
    ],
    I.men
  ],

  [
    'sportswear',
    'Women',
    'Sportswear',
    [
      'Aero Leggings',
      'Active Runner',
      'Motion Set'
    ],
    I.women
  ],

  [
    'accessories',
    'Men',
    'Accessories',
    [
      'Minimal Watch',
      'Leather Wallet',
      'Urban Bag'
    ],
    I.acc
  ],

  [
    'accessories',
    'Women',
    'Accessories',
    [
      'Classic Watch',
      'Leather Bag',
      'Everyday Tote'
    ],
    I.acc
  ]

];


const P = [];

for(let i=1;i<=500;i++){

  let t=T[(i-1)%T.length];

  let n=t[3][(i-1)%t[3].length];

  let pr=29+(i*37)%220;

  P.push({

    id:i,

    name:n+" "+Math.ceil(i/11),

    gender:t[1],

    type:t[2],

    category:t[0],

    price:pr,

    old:pr+35+(i*7)%90,

    img:t[4][(i-1)%t[4].length]

  });

}


let cat='all';

let q='';

let shown=24;

let cart=[];

let wish=[];


const $ = x =>
  document.getElementById(x);


const money = x =>
  '$'+x.toFixed(2);


function data(){

  let a=P.filter(p =>

    (
      cat==='all' ||

      p.category===cat ||

      (cat==='men' && p.gender==='Men') ||

      (cat==='women' && p.gender==='Women')

    )

    &&

    (

      p.name+' '+
      p.gender+' '+
      p.type+' '+
      p.category

    )

    .toLowerCase()

    .includes(q.toLowerCase())

  );


  let s=$('sort').value;


  if(s==='low')
    a.sort((x,y)=>x.price-y.price);


  if(s==='high')
    a.sort((x,y)=>y.price-x.price);


  if(s==='name')
    a.sort((x,y)=>x.name.localeCompare(y.name));


  return a;

}


function render(){

  let a=data();

  let v=a.slice(0,shown);


  $('counter').textContent=
    a.length+' Products';


  $('result').textContent=
    `Showing ${v.length} of ${a.length} products`;


  $('grid').innerHTML =

    v.length

    ?

    v.map(p=>`

      <article class="card">

        <div class="photo">

          <span class="tag">
            ${p.type}
          </span>

          <button
            class="heart ${wish.includes(p.id)?'active':''}"
            onclick="toggleWish(${p.id})"
          >

            <i data-lucide="heart"></i>

          </button>

          <img
            src="${p.img}"
            onclick="openProduct(${p.id})"
            alt="${p.name}"
          >

        </div>


        <div class="info">

          <div class="name">
            ${p.name}
          </div>

          <div class="cat">
            ${p.gender} · ${p.type}
          </div>


          <div class="bottom">

            <div>

              <span class="price">
                ${money(p.price)}
              </span>

              <span class="old">
                ${money(p.old)}
              </span>

            </div>


            <button
              class="add"
              onclick="addCart(${p.id})"
            >

              <i data-lucide="plus"></i>

            </button>

          </div>

        </div>

      </article>

    `).join('')

    :

    `

      <div
        class="empty"
        style="grid-column:1/-1"
      >

        <h3>
          No products found
        </h3>

        <p>
          Try another search or category.
        </p>

      </div>

    `;


  $('load').style.display =
    shown<a.length
    ? 'block'
    : 'none';


  lucide.createIcons();

}


function toast(s){

  $('toast').textContent=s;

  $('toast').classList.add('show');

  setTimeout(
    ()=>$('toast').classList.remove('show'),
    1600
  );

}


function addCart(id){

  let x=cart.find(x=>x.id===id);

  x
    ? x.qty++
    : cart.push({id,qty:1});

  updateCart();

  toast('Added to your bag');

}


function qty(id,d){

  let x=cart.find(x=>x.id===id);

  if(!x)return;

  x.qty+=d;

  if(x.qty<1)
    cart=cart.filter(y=>y.id!==id);

  updateCart();

}


function updateCart(){

  let n=cart.reduce(
    (a,x)=>a+x.qty,
    0
  );

  $('cartCount').textContent=n;


  let total=0;


  $('cartList').innerHTML =

    cart.length

    ?

    cart.map(x=>{

      let p=P.find(
        y=>y.id===x.id
      );

      total+=p.price*x.qty;


      return `

        <div class="item">

          <img src="${p.img}">

          <div class="iname">

            ${p.name}

            <div class="qty">

              <button
                onclick="qty(${p.id},-1)"
              >
                −
              </button>

              ${x.qty}

              <button
                onclick="qty(${p.id},1)"
              >
                +
              </button>

            </div>

          </div>


          <b>
            ${money(p.price*x.qty)}
          </b>


          <button
            class="remove"
            onclick="qty(${p.id},-999)"
          >

            <i data-lucide="trash-2"></i>

          </button>

        </div>

      `;

    }).join('')

    :

    '<div class="empty">Your bag is empty.</div>';


  $('total').innerHTML=`

    <div
      style="
      display:flex;
      justify-content:space-between;
      font-weight:800"
    >

      <span>Total</span>

      <span>
        ${money(total)}
      </span>

    </div>


    <button
      class="checkout"
      onclick="checkout()"
    >
      Proceed to Checkout
    </button>

  `;


  lucide.createIcons();

}


function toggleWish(id){

  wish.includes(id)

    ?

    wish=wish.filter(
      x=>x!==id
    )

    :

    wish.push(id);


  $('wishCount').textContent=
    wish.length;


  render();

  renderWish();


  toast(
    wish.includes(id)
      ? 'Added to wishlist'
      : 'Removed from wishlist'
  );

}


function renderWish(){

  $('wishList').innerHTML=

    wish.length

    ?

    wish.map(id=>{

      let p=P.find(
        x=>x.id===id
      );


      return `

        <div class="item">

          <img src="${p.img}">

          <div class="iname">

            ${p.name}

            <div
              style="
              color:var(--muted);
              margin-top:4px"
            >

              ${money(p.price)}

            </div>

          </div>


          <button
            class="remove"
            onclick="toggleWish(${p.id})"
          >

            <i data-lucide="trash-2"></i>

          </button>

        </div>

      `;

    }).join('')

    :

    '<div class="empty">Your wishlist is empty.</div>';


  lucide.createIcons();

}


function drawers(type){

  $('backdrop')
    .classList
    .add('open');


  $(type==='cart'
    ? 'cartDrawer'
    : 'wishDrawer'
  )
  .classList
  .add('open');

}


function closeDrawers(){

  $('backdrop')
    .classList
    .remove('open');


  $('cartDrawer')
    .classList
    .remove('open');


  $('wishDrawer')
    .classList
    .remove('open');

}


function openProduct(id){

  let p=P.find(
    x=>x.id===id
  );


  $('details').innerHTML=`

    <div>

      <img
        src="${p.img}"
        alt="${p.name}"
      >

    </div>


    <div>

      <span
        class="tag"
        style="
        position:static;
        display:inline-block"
      >

        ${p.type}

      </span>


      <h2>
        ${p.name}
      </h2>


      <div class="cat">
        ${p.gender} · ${p.type}
      </div>


      <h2>
        ${money(p.price)}
      </h2>


      <span class="old">
        ${money(p.old)}
      </span>


      <p>
        Premium ${p.gender.toLowerCase()}
        ${p.type.toLowerCase()}
        with a clean, modern style
        for this e-commerce demo.
      </p>


      <div class="buy">

        <button
          onclick="toggleWish(${p.id})"
        >

          <i data-lucide="heart"></i>

          Wishlist

        </button>


        <button
          class="primary"
          onclick="
            addCart(${p.id});
            closeModal()
          "
        >

          Add to Bag

        </button>

      </div>

    </div>

  `;


  $('productModal')
    .classList
    .add('open');


  lucide.createIcons();

}


function closeModal(){

  $('productModal')
    .classList
    .remove('open');


  $('checkoutModal')
    .classList
    .remove('open');

}


function checkout(){

  if(!cart.length){

    return toast(
      'Your bag is empty'
    );

  }


  closeDrawers();

  $('checkoutModal')
    .classList
    .add('open');

}


/* CATEGORY */

$('tabs').onclick=e=>{

  let b=e.target.closest('.tab');

  if(!b)return;


  document
    .querySelectorAll('.tab')
    .forEach(x=>
      x.classList.remove('active')
    );


  b.classList.add('active');


  cat=b.dataset.cat;

  shown=24;

  render();

};


/* SEARCH */

$('search').oninput=e=>{

  q=e.target.value;

  shown=24;

  render();

};


/* SORT */

$('sort').onchange=render;


/* LOAD MORE */

$('load').onclick=()=>{

  shown+=24;

  render();

};


/* CART */

$('cartBtn').onclick=()=>{

  updateCart();

  drawers('cart');

};


/* WISHLIST */

$('wishBtn').onclick=()=>{

  renderWish();

  drawers('wish');

};


/* CLOSE */

$('backdrop').onclick=
  closeDrawers;


document
  .querySelectorAll('[data-close]')
  .forEach(x=>
    x.onclick=closeDrawers
  );


$('modalClose').onclick=
  closeModal;


$('checkoutClose').onclick=
  closeModal;


/* DEMO ORDER */

$('placeOrder').onclick=()=>{

  cart=[];

  updateCart();

  closeModal();

  toast(
    'Demo order placed successfully!'
  );

};


/* INITIALIZE */

render();

updateCart();

renderWish();

lucide.createIcons();

</script>

</body>
</html>
